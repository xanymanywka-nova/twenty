name: Build Nova CRM image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/xanymanywka-nova/nova-crm

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set image metadata
        id: image-metadata
        shell: bash
        # APP_VERSION must be semver and is recorded against upgrade
        # migrations, so it follows the upstream version this fork is on.
        run: |
          version=$(grep -oE "'[0-9]+\.[0-9]+\.[0-9]+'" packages/twenty-server/src/engine/core-modules/upgrade/constants/twenty-current-version.constant.ts | tr -d "'")
          test -n "$version"
          echo "short-sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "app-version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/twenty-docker/twenty/Dockerfile
          # The last stage is the all-in-one dev image with its own Postgres/Redis/ClickHouse.
          target: twenty
          platforms: linux/amd64
          push: true
          build-args: |
            APP_VERSION=${{ steps.image-metadata.outputs.app-version }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:sha-${{ steps.image-metadata.outputs.short-sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
